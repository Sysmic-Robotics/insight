<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1e293b; /* slate-800 */
      overflow: hidden;
    }
    .splash-container {
      text-align: center;
    }
    img {
      width: 128px;
      height: 128px;
    }
    .loading-text {
      color: #cbd5e1; /* slate-300 */
      margin-top: 1rem;
      font-family: sans-serif;
    }
    .loading-bar-container {
      width: 200px;
      height: 8px;
      background-color: #334155; /* slate-700 */
      border-radius: 4px;
      margin: 1rem auto 0;
      overflow: hidden;
    }
    .loading-bar {
      width: 100%;
      height: 100%;
      background-color: #4f46e5; /* indigo-600 */
      border-radius: 4px;
      transform-origin: left;
      animation: load 1.5s infinite cubic-bezier(0.65, 0.05, 0.36, 1);
    }
    @keyframes load {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <img src="../docs/logoinsight.png" alt="Loading...">
    <div class="loading-text">Loading...</div>
    <div class="loading-bar-container">
      <div class="loading-bar"></div>
    </div>
  </div>
</body>
</html>
